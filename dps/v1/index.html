<!doctype html>
<meta charset="utf-8">
<title>Detailed Postgame local storage v1</title>
<script>
// Detailed Post Scoreboard Menu (pak11) and Observer HUD's post-game board (pak10): the board's own row layout.
// Same fragment-in / title-out transport as ../../ (HP Colors) and ../../oh/v2/, its own prefix and key. The data
// stays in this origin's localStorage in Steam's CEF profile, not on a server. Key (never another mod's):
//   hantu.detailed_postgame.v1/prefs   {"v":1,"rows":[seven stat keys, "" for an empty row],"clicked":true}, at most
//   512 chars (the page checks v and rows)
// Ops (request {i,o,...} in the URL fragment): hello, r (read), w (write, c = the record as text), it (one player's
// item purchases: m = match id, h = hero id). "it" reads deadlock-api's public match metadata (the only request
// this page sends anywhere; nothing is stored) and replies v = [[item class name, bought s, sold s (0: kept)], ...]
// in purchase order, x = 0 when deadlock-api does not have the match or the hero is not in it.
(function () {
  "use strict";
  var VERSION = 1;
  var PREFIX = "DPS1:";
  var KEY = "hantu.detailed_postgame.v1/prefs";
  var MAX_RECORD = 512;
  var ROWS = 7;
  var STAT_KEY = /^[a-z]{2,8}$/;
  var API = "https://api.deadlock-api.com/v1/matches/";
  var API_TIMEOUT_MS = 15000;
  var MAX_TITLE = 3800; // the game cuts HTMLTitle at 4096 characters

  // ITEM-NAMES:START (detailed_postgame/scripts/gen-item-names.js)
  var ITEM_NAMES = ["upgrade_ability_power_shard","upgrade_ability_refresher","upgrade_absorbing_armor",
    "upgrade_acolytes_glove","upgrade_active_reload","upgrade_aerial_supremacy","upgrade_ammo_scavenger",
    "upgrade_ancient_shield","upgrade_aoe_root","upgrade_apex_combat","upgrade_aprounds","upgrade_arcane_extension",
    "upgrade_arcane_surge","upgrade_arctic_blast","upgrade_auto_cleanse","upgrade_banshee_slugs","upgrade_berserker",
    "upgrade_blitz_bullets","upgrade_blood_tribute","upgrade_boundless_spirit","upgrade_boxing_glove",
    "upgrade_building_buster","upgrade_bullet_armor","upgrade_bullet_armor_reduction_aura",
    "upgrade_bullet_resist_shredder","upgrade_bulletshredimbue","upgrade_burst_fire","upgrade_capacitor",
    "upgrade_cardio_calibrator","upgrade_celestial_guidance","upgrade_chain_lightning","upgrade_cheat_death",
    "upgrade_chonky","upgrade_clip_size","upgrade_cloak_of_opportunity","upgrade_cloaking_device_active",
    "upgrade_close_quarter_combat","upgrade_close_range","upgrade_cold_front","upgrade_colossus",
    "upgrade_containment","upgrade_cooldown_reduction","upgrade_corpse_explosion","upgrade_counterspell",
    "upgrade_crackshot","upgrade_critshot","upgrade_crushing_fists","upgrade_damage_recycler",
    "upgrade_debuff_reducer","upgrade_deflecting_armor","upgrade_discord","upgrade_divine_barrier",
    "upgrade_diviners_kevlar","upgrade_dps_aura","upgrade_eldritch_shot","upgrade_electric_slippers",
    "upgrade_enchanted_holsters","upgrade_endurance","upgrade_escalating_exposure","upgrade_eternal_gift",
    "upgrade_ethereal_bullets","upgrade_express_shot","upgrade_extra_charge","upgrade_fervor",
    "upgrade_fleetfoot_boots","upgrade_focus_lens","upgrade_fury_trance","upgrade_glass_cannon",
    "upgrade_glass_cannon2","upgrade_glitch","upgrade_goose_egg","upgrade_greater_withering_whip","upgrade_grit",
    "upgrade_guardian_ward","upgrade_haunting_scream","upgrade_headhunter","upgrade_headshot_booster",
    "upgrade_headshot_booster2","upgrade_heal_on_level","upgrade_healbane","upgrade_healbuff",
    "upgrade_healing_booster","upgrade_health","upgrade_health_2","upgrade_health_nova",
    "upgrade_health_stealing_magic","upgrade_health_stimpak","upgrade_high_velocity_mag",
    "upgrade_hollow_point_rounds","upgrade_icarus_wings","upgrade_imbued_duration_extender",
    "upgrade_improved_bullet_armor","upgrade_improved_spirit","upgrade_improved_stamina","upgrade_infinite_rounds",
    "upgrade_infinitemagazine","upgrade_infuser","upgrade_inhibitor","upgrade_intensifying_clip","upgrade_juggernaut",
    "upgrade_kinetic_sash","upgrade_lifestrike_gauntlets","upgrade_long_range","upgrade_magic_burst",
    "upgrade_magic_carpet","upgrade_magic_missile","upgrade_magic_reach","upgrade_magic_shield","upgrade_magic_shock",
    "upgrade_magic_slow","upgrade_magic_storm","upgrade_magic_tempo","upgrade_magic_vulnerability",
    "upgrade_medic_bullets","upgrade_melee_charge","upgrade_melee_rebuttal","upgrade_metal_skin",
    "upgrade_mystic_regeneration","upgrade_mystic_reverb","upgrade_mystical_piano","upgrade_non_player_bonus",
    "upgrade_non_player_bonus_sacrifice","upgrade_nullification_aura","upgrade_omnicharge_pendant",
    "upgrade_patrons_blessing","upgrade_personal_rejuvenator","upgrade_phantom_strike","upgrade_prism_blast",
    "upgrade_pristine_emblem","upgrade_proc_silence","upgrade_quick_silver","upgrade_rapid_recharge",
    "upgrade_rapid_rounds","upgrade_rebirth","upgrade_rechargingbullets","upgrade_reduce_debuff_duration",
    "upgrade_regenerating_bullet_shield","upgrade_reinforcing_casings","upgrade_rescue_beam","upgrade_resilience",
    "upgrade_resonant_healing","upgrade_restorative_locket","upgrade_return_fire","upgrade_ricochet",
    "upgrade_rocket_booster","upgrade_rocket_boots","upgrade_runed_gauntlets","upgrade_rupture","upgrade_self_bubble",
    "upgrade_shadow_step","upgrade_shadow_strike","upgrade_sharpshooter","upgrade_shivas_bracelet",
    "upgrade_shrink_ray","upgrade_silencer","upgrade_siphon_bullets","upgrade_slowing_bullets",
    "upgrade_soaring_spirit","upgrade_spellbreaker","upgrade_spellshield","upgrade_spellslinger_headshots",
    "upgrade_spirit_bubble","upgrade_spirit_burn","upgrade_spirit_sap","upgrade_spirit_snatch","upgrade_split_shot",
    "upgrade_sprint_booster","upgrade_stackingdamageproc","upgrade_superacolytes_glove","upgrade_superior_stamina",
    "upgrade_suppressor","upgrade_surging_power","upgrade_target_stun","upgrade_targeted_silence",
    "upgrade_tech_armor","upgrade_tech_damage_pulse","upgrade_tech_defense_shredders","upgrade_tech_overflow",
    "upgrade_tech_purge","upgrade_tech_range","upgrade_thermal_detonator","upgrade_timeless_emblem",
    "upgrade_titan_round","upgrade_toxic_bullets","upgrade_transcendent_cooldown","upgrade_trophy_collector",
    "upgrade_ultimate_burst","upgrade_unstable_concoction","upgrade_unstoppable","upgrade_vampire",
    "upgrade_veil_walker","upgrade_vex_barrier","upgrade_vex_barrier_shield","upgrade_warp_stone",
    "upgrade_weapon_backstabber","upgrade_weapon_shielding","upgrade_weighted_shots","upgrade_withering_whip"];
  // ITEM-NAMES:END

  // An item id is the MurmurHash2 (seed 0x31415926) of its class name (UTF-8; the names are ASCII).
  function murmur2(text, seed) {
    var m = 0x5bd1e995;
    var len = text.length;
    var h = (seed ^ len) >>> 0;
    var i = 0;
    while (len >= 4) {
      var k = (text.charCodeAt(i) & 0xff) | ((text.charCodeAt(i + 1) & 0xff) << 8) | ((text.charCodeAt(i + 2) & 0xff) << 16) | ((text.charCodeAt(i + 3) & 0xff) << 24);
      k = Math.imul(k, m);
      k ^= k >>> 24;
      k = Math.imul(k, m);
      h = Math.imul(h, m) ^ k;
      i += 4;
      len -= 4;
    }
    if (len === 3) h ^= (text.charCodeAt(i + 2) & 0xff) << 16;
    if (len >= 2) h ^= (text.charCodeAt(i + 1) & 0xff) << 8;
    if (len >= 1) { h ^= text.charCodeAt(i) & 0xff; h = Math.imul(h, m); }
    h ^= h >>> 13;
    h = Math.imul(h, m);
    h ^= h >>> 15;
    return h >>> 0;
  }
  var ITEM_BY_ID = {};
  for (var n = 0; n < ITEM_NAMES.length; n++) ITEM_BY_ID[murmur2(ITEM_NAMES[n], 0x31415926)] = ITEM_NAMES[n];

  // One fetch per match while this page is open; the board asks once per player.
  var matches = {};
  function loadMatch(id, done) {
    var entry = matches[id];
    if (entry && entry.state !== "loading") { done(entry); return; }
    if (entry) { entry.waiters.push(done); return; }
    entry = matches[id] = { state: "loading", players: null, error: "", waiters: [done] };
    var finish = function (state, players, error) {
      entry.state = state;
      entry.players = players;
      entry.error = error;
      var waiters = entry.waiters;
      entry.waiters = [];
      for (var w = 0; w < waiters.length; w++) waiters[w](entry); // a failure stands for this load of the page
    };
    var xhr = null;
    try {
      xhr = new XMLHttpRequest();
      xhr.open("GET", API + id + "/metadata");
      xhr.timeout = API_TIMEOUT_MS;
    } catch (error) {
      finish("error", null, "no request");
      return;
    }
    xhr.onload = function () {
      if (xhr.status === 404) { finish("missing", null, ""); return; }
      if (xhr.status !== 200) { finish("error", null, "http " + xhr.status); return; }
      var data = null;
      try { data = JSON.parse(xhr.responseText); } catch (error) { finish("error", null, "bad json"); return; }
      var players = data && data.match_info && data.match_info.players;
      finish(Array.isArray(players) ? "done" : "missing", Array.isArray(players) ? players : null, "");
    };
    xhr.onerror = function () { finish("error", null, "network"); };
    xhr.ontimeout = function () { finish("error", null, "timeout"); };
    try { xhr.send(); } catch (error) { finish("error", null, "no request"); }
  }
  function purchases(player) {
    var out = [];
    var items = Array.isArray(player.items) ? player.items : [];
    for (var j = 0; j < items.length; j++) {
      var name = ITEM_BY_ID[items[j].item_id];
      if (name) out.push([name, items[j].game_time_s | 0, items[j].sold_time_s | 0]);
    }
    return out;
  }

  function reply(message) {
    document.title = PREFIX + JSON.stringify(message);
  }

  // {"v":1,"rows":[...]}: seven keys, each a short lower-case name or "", no key twice.
  function validRecord(text) {
    if (typeof text !== "string" || text.length > MAX_RECORD) return false;
    var record = null;
    try { record = JSON.parse(text); } catch (error) { return false; }
    if (!record || record.v !== 1 || !Array.isArray(record.rows) || record.rows.length !== ROWS) return false;
    var seen = {};
    for (var i = 0; i < ROWS; i++) {
      var key = record.rows[i];
      if (key === "") continue;
      if (typeof key !== "string" || !STAT_KEY.test(key) || seen[key]) return false;
      seen[key] = true;
    }
    return true;
  }

  function handle() {
    var request = null;
    try {
      request = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      if (!request || typeof request.i !== "string" || request.i.length > 80) return;
      var id = request.i;
      if (request.o === "hello") {
        reply({ i: id, o: "ready", ok: true, v: VERSION, m: MAX_RECORD, h: location.href });
        return;
      }
      if (request.o === "r") {
        var value = localStorage.getItem(KEY);
        reply(validRecord(value) ? { i: id, o: "r", ok: true, x: 1, v: value } : { i: id, o: "r", ok: true, x: 0 });
        return;
      }
      if (request.o === "it") {
        var match = String(request.m);
        var hero = request.h;
        if (!/^\d{1,12}$/.test(match) || typeof hero !== "number" || hero < 1 || hero > 9999) throw new Error("invalid_request");
        loadMatch(match, function (entry) {
          if (entry.state === "error") { reply({ i: id, o: "it", ok: false, e: entry.error }); return; }
          var player = null;
          for (var p = 0; entry.players && p < entry.players.length; p++) if (entry.players[p].hero_id === hero) player = entry.players[p];
          if (!player) { reply({ i: id, o: "it", ok: true, x: 0 }); return; }
          var v = purchases(player);
          var message = { i: id, o: "it", ok: true, x: 1, v: v };
          // Too long for a title: the items kept to the end only (what the board shows).
          if (JSON.stringify(message).length + PREFIX.length > MAX_TITLE) message.v = v.filter(function (row) { return !row[2]; });
          reply(message);
        });
        return;
      }
      if (request.o === "w") {
        if (!validRecord(request.c)) throw new Error("invalid_record");
        localStorage.setItem(KEY, request.c);
        reply({ i: id, o: "w", ok: true });
        return;
      }
      throw new Error("invalid_request");
    } catch (error) {
      if (request && typeof request.i === "string")
        reply({ i: request.i.slice(0, 80), o: String(request.o).slice(0, 12), ok: false, e: String(error && error.message ? error.message : error).slice(0, 160) });
    }
  }

  window.addEventListener("hashchange", handle);
  handle();
})();
</script>
