<!doctype html>
<meta charset="utf-8">
<title>Observer HUD local storage v2 (probe)</title>
<script>
// PROBE copy of a v2 /oh/ page (2026-10-25, observer_hud/decisions/postgame-identity-perf-plan.md P7).
// TEMPORARY test page: its own v2probe keys, so it never reads or writes the v1 key (hantu.observer_hud.v1/state).
// Two keys (state, matches), an upsert that merges one match card inside the page, and a test-only fill.
(function () {
  "use strict";
  var PREFIX = "OHS2:";
  var KEYS = { state: "hantu.observer_hud.v2probe/state", matches: "hantu.observer_hud.v2probe/matches" };
  var MAX = 131072;

  function checksum(text) {
    var hash = 0x811c9dc5;
    for (var i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619) >>> 0; }
    return ("0000000" + hash.toString(16)).slice(-8);
  }
  function reply(message) { document.title = PREFIX + JSON.stringify(message); }
  function readMatches() {
    try { var v = JSON.parse(localStorage.getItem(KEYS.matches) || "null"); if (v && v.m) return v; } catch (e) {}
    return { m: [] };
  }
  function sameRoster(a, b) {
    var x = a.a.concat(a.b).sort().join(","), y = b.a.concat(b.b).sort().join(",");
    return x === y;
  }
  function handle() {
    var q = null;
    try {
      q = JSON.parse(decodeURIComponent(location.hash.slice(1)));
      if (!q || typeof q.i !== "string" || q.i.length > 80) return;
      var t0 = Date.now();
      if (q.o === "hello") return reply({ i: q.i, o: "ready", ok: true, v: 2, m: MAX });
      var key = KEYS[q.k];
      if (q.o === "r") {
        if (!key) throw new Error("key");
        var v = localStorage.getItem(key);
        return reply({ i: q.i, o: "r", ok: true, x: v === null ? 0 : 1, len: v === null ? 0 : v.length, sum: v === null ? "" : checksum(v), v: v, ms: Date.now() - t0 });
      }
      if (q.o === "fill") {
        if (!key || !(q.n > 0 && q.n <= MAX)) throw new Error("fill");
        var s = "";
        while (s.length < q.n) s += "0123456789abcdef";
        s = s.slice(0, q.n);
        localStorage.setItem(key, s);
        return reply({ i: q.i, o: "fill", ok: true, len: s.length, sum: checksum(s) });
      }
      if (q.o === "u") {
        var card = q.c;
        if (!card || !Array.isArray(card.a) || !Array.isArray(card.b)) throw new Error("card");
        var all = readMatches();
        all.m = all.m.filter(function (m) { return !(m.a && m.b && sameRoster(m, card)); });
        all.m.push(card);
        var text = JSON.stringify(all);
        while (text.length > 32768 && all.m.length > 1) { all.m.shift(); text = JSON.stringify(all); }
        localStorage.setItem(KEYS.matches, text);
        return reply({ i: q.i, o: "u", ok: true, n: all.m.length, len: text.length, ms: Date.now() - t0 });
      }
      if (q.o === "clear") { localStorage.removeItem(KEYS.matches); localStorage.removeItem(KEYS.state); return reply({ i: q.i, o: "clear", ok: true }); }
      throw new Error("invalid_request");
    } catch (error) {
      if (q && typeof q.i === "string") reply({ i: q.i.slice(0, 80), o: String(q.o).slice(0, 12), ok: false, e: String(error).slice(0, 160) });
    }
  }
  window.addEventListener("hashchange", handle);
  handle();
})();
</script>
